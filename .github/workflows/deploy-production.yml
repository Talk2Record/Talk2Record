name: Deploy production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deployable:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.github/workflows/deploy-production.yml'
              - '.github/workflows/build-images.yml'

  build:
    name: Build images
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      environment: production
      next_public_api_base_url: https://talk2record.com
      next_public_app_url: https://talk2record.com
      next_public_google_sign_in_enabled: 'false'
    secrets: inherit

  deploy:
    name: SSH deploy to VPS
    needs: [changes, build]
    if: |
      needs.changes.outputs.deployable == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      # Configure required reviewers + protection rules in the GitHub UI:
      # https://docs.github.com/actions/deployment/targeting-different-environments/
      name: production
      url: https://talk2record.com
    steps:
      - name: Validate deploy configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "${{ vars.SSH_HOST }}" ]] && missing+=(SSH_HOST)
          [[ -z "${{ vars.SSH_USER }}" ]] && missing+=(SSH_USER)
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=(SSH_PRIVATE_KEY)
          [[ -z "${{ secrets.KNOWN_HOSTS }}" ]] && missing+=(KNOWN_HOSTS)
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing production environment config: ${missing[*]}. SSH_HOST/SSH_USER/SSH_PORT are variables; SSH_PRIVATE_KEY/KNOWN_HOSTS are secrets (see deploy/README.md §6.1)."
            exit 1
          fi
          if [[ "$SSH_PRIVATE_KEY" != *"BEGIN"* ]]; then
            echo "::error::SSH_PRIVATE_KEY must be the full PEM private key (-----BEGIN ... -----END ...), not a public key or deploy-key id."
            exit 1
          fi

      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT || '22' }}
          key_path: ~/.ssh/deploy_key
          envs: IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script: |
            set -euo pipefail
            export ENV=prod
            export TAG="$IMAGE_TAG"
            export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
            export GHCR_USER="$GHCR_USER"
            export GHCR_TOKEN="$GHCR_TOKEN"
            /opt/talk2record/repo/deploy/scripts/deploy.sh
        env:
          IMAGE_NAMESPACE: ${{ needs.build.outputs.image_namespace }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
