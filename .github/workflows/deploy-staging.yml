name: Deploy staging

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deployable:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/build-images.yml'

  build:
    name: Build images
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      environment: staging
      next_public_api_base_url: https://staging.talk2record.com
      next_public_app_url: https://staging.talk2record.com
      next_public_google_sign_in_enabled: 'false'
    secrets: inherit

  deploy:
    name: SSH deploy to VPS
    needs: [changes, build]
    if: |
      needs.changes.outputs.deployable == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.talk2record.com
    steps:
      - name: Validate deploy configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -z "${{ vars.SSH_HOST }}" ]] && missing+=(SSH_HOST)
          [[ -z "${{ vars.SSH_USER }}" ]] && missing+=(SSH_USER)
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=(SSH_PRIVATE_KEY)
          [[ -z "${{ secrets.KNOWN_HOSTS }}" ]] && missing+=(KNOWN_HOSTS)
          if [[ -z "${{ secrets.ENV_DJANGO }}" && -z "${{ secrets.ENV_DJANGO_B64 }}" ]]; then
            missing+=(ENV_DJANGO)
          fi
          if [[ -z "${{ secrets.ENV_POSTGRES }}" && -z "${{ secrets.ENV_POSTGRES_B64 }}" ]]; then
            missing+=(ENV_POSTGRES)
          fi
          if [[ -z "${{ secrets.ENV_FRONTEND }}" && -z "${{ secrets.ENV_FRONTEND_B64 }}" ]]; then
            missing+=(ENV_FRONTEND)
          fi
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing staging environment config: ${missing[*]}. See deploy/README.md §6.1."
            exit 1
          fi
          if [[ "$SSH_PRIVATE_KEY" != *"BEGIN"* ]]; then
            echo "::error::SSH_PRIVATE_KEY must be the full PEM private key (-----BEGIN ... -----END ...), not a public key or deploy-key id."
            exit 1
          fi

      - name: Prepare SSH credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          DEPLOY_KEY_PATH="${RUNNER_TEMP}/gha_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$DEPLOY_KEY_PATH"
          chmod 600 "$DEPLOY_KEY_PATH"
          ssh-keygen -y -f "$DEPLOY_KEY_PATH" >/dev/null
          echo "DEPLOY_KEY_PATH=$DEPLOY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Run deploy.sh on VPS
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT || '22' }}
          key_path: ${{ env.DEPLOY_KEY_PATH }}
          envs: >-
            IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN,
            ENV_DJANGO,ENV_POSTGRES,ENV_FRONTEND,
            ENV_DJANGO_B64,ENV_POSTGRES_B64,ENV_FRONTEND_B64
          command_timeout: 20m
          script: |
            set -euo pipefail
            export ENV=staging
            export TAG="$IMAGE_TAG"
            export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
            export GHCR_USER="$GHCR_USER"
            export GHCR_TOKEN="$GHCR_TOKEN"
            /opt/talk2record/repo/deploy/scripts/deploy.sh
        env:
          IMAGE_NAMESPACE: ${{ needs.build.outputs.image_namespace }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_DJANGO: ${{ secrets.ENV_DJANGO }}
          ENV_POSTGRES: ${{ secrets.ENV_POSTGRES }}
          ENV_FRONTEND: ${{ secrets.ENV_FRONTEND }}
          ENV_DJANGO_B64: ${{ secrets.ENV_DJANGO_B64 }}
          ENV_POSTGRES_B64: ${{ secrets.ENV_POSTGRES_B64 }}
          ENV_FRONTEND_B64: ${{ secrets.ENV_FRONTEND_B64 }}
