name: Deploy staging

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: deploy-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deployable:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.github/workflows/deploy-staging.yml'
              - '.github/workflows/build-images.yml'

  build:
    name: Build images
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    uses: ./.github/workflows/build-images.yml
    with:
      environment: staging
      next_public_api_base_url: https://staging.talk2record.com
      next_public_app_url: https://staging.talk2record.com
      next_public_google_sign_in_enabled: 'false'
    secrets: inherit

  deploy:
    name: SSH deploy to VPS
    needs: [changes, build]
    if: |
      needs.changes.outputs.deployable == 'true' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.talk2record.com
    steps:
      - name: Prepare SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAMESPACE,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          command_timeout: 20m
          script_stop: true
          script: |
            export ENV=staging
            export TAG="$IMAGE_TAG"
            export IMAGE_NAMESPACE="$IMAGE_NAMESPACE"
            export GHCR_USER="$GHCR_USER"
            export GHCR_TOKEN="$GHCR_TOKEN"
            /opt/talk2record/repo/deploy/scripts/deploy.sh
        env:
          IMAGE_NAMESPACE: ${{ needs.build.outputs.image_namespace }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
