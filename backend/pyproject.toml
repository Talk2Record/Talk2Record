[project]
name = "talk2record"
version = "0.1.0"
description = "Talk2Record converts WhatsApp voice notes from business staff into structured business records using AI"
readme = "README.md"
license = { text = "Apache Software License 2.0" }
authors = [
  { name = "Alpha Nganga Ndirangu", email = "alpha@talk2record.com" },
]
requires-python = "==3.13.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anthropic>=0.25",
  "argon2-cffi==25.1.0",
  "celery==5.6.2",
  "channels>=4.2.2",
  "channels-redis>=4.2.0",
  "crispy-bootstrap5==2026.3",
  "django==6.0.3",
  "django-allauth[mfa]==65.15.0",
  "django-anymail[brevo]==14.0",
  "django-celery-beat==2.9.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.6",
  "django-environ==0.13.0",
  "django-model-utils==5.0.0",
  "django-redis==6.0.0",
  "django-storages[s3]==1.14.6",
  "django-unfold>=0.86.1",
  "djangorestframework==3.16.1",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.29.0",
  "flower==2.0.1",
  "gunicorn==25.1.0",
  "hiredis==3.3.1",
  "jsonschema>=4.20",
  "openai>=1.0",
  "pillow==12.1.1",
  "psycopg[c]==3.3.3",
  "python-slugify==8.0.4",
  "redis==7.3.0",
  "sentry-sdk==2.54.0",
  "uvicorn[standard]==0.42.0",
  "uvicorn-worker==0.4.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.13.5",
  "django-coverage-plugin==3.2.0",
  "django-debug-toolbar==6.2.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.0.0",
  "djangorestframework-stubs==3.16.8",
  "djlint==1.36.4",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
  "psycopg[c]==3.3.3",
  "pytest==9.0.2",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.6",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.1.1",
  "werkzeug[watchdog]==3.1.6",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
# Test modules: lazy imports, magic values, fixture passwords, and namespace packages.
lint.per-file-ignores."**/tests/**/*.py" = [
  "E501",
  "INP001",
  "PLC0415",
  "PLR0913",
  "PLR2004",
  "PT011",
  "PT019",
  "RUF003",
  "S105",
  "S106",
  "SIM117",
  "SLF001",
]
# Local Docker dev binds to all interfaces intentionally.
lint.per-file-ignores."config/settings/local.py" = [ "S104" ]
# Lazy imports: optional AI SDKs and provider registration at startup.
lint.per-file-ignores."talk2record/ai/providers/registry.py" = [ "PLC0415" ]
# Lazy imports: recovery and usage modules cross-reference each other.
lint.per-file-ignores."talk2record/billing/recovery_service.py" = [ "PLC0415" ]
# DRF serializers expose camelCase fields matching the frontend / Paddle API.
lint.per-file-ignores."talk2record/billing/serializers.py" = [ "N802", "N815" ]
# Lazy imports: Celery task modules defer Django/model imports until task execution.
lint.per-file-ignores."talk2record/billing/tasks.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/conftest.py" = [ "DTZ011", "PLC0415" ]
# Lazy imports: event bus defers task/model imports to break circular dependencies.
lint.per-file-ignores."talk2record/events/bus.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/events/tasks.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/ingestion/serializers.py" = [ "N815" ]
lint.per-file-ignores."talk2record/ingestion/tasks.py" = [ "PLC0415" ]
# Lazy imports: billing reset helpers loaded inside admin actions to avoid cycles.
lint.per-file-ignores."talk2record/organizations/admin.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/organizations/serializers.py" = [ "N815" ]
lint.per-file-ignores."talk2record/usage/services.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/users/admin.py" = [ "PLC0415" ]
lint.per-file-ignores."talk2record/users/serializers/user.py" = [ "N802", "N815" ]
lint.per-file-ignores."talk2record/users/views/admin_user_view_set.py" = [ "N802", "N815" ]
lint.per-file-ignores."talk2record/users/views/sessions_view.py" = [ "N802", "N815" ]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib --no-migrations"
ini_options.python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "talk2record/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2
