volumes:
  staging_postgres_data: {}
  staging_postgres_data_backups: {}
  staging_redis_data: {}

networks:
  default:
  edge:
    name: talk2record_staging
    external: true

services:
  django: &django
    image: ${IMAGE_NAMESPACE:-ghcr.io/talk2record}/talk2record-django:${IMAGE_TAG:-staging}
    container_name: talk2record-staging-django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ${ENVS_DIR:-./.envs/.staging}/.django
      - ${ENVS_DIR:-./.envs/.staging}/.postgres
    command: /start
    networks:
      - default
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --tries=1 http://localhost:5000/api/schema/ >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    image: ${IMAGE_NAMESPACE:-ghcr.io/talk2record}/talk2record-frontend:${IMAGE_TAG:-staging}
    container_name: talk2record-staging-frontend
    restart: unless-stopped
    env_file:
      - ${ENVS_DIR:-./.envs/.staging}/.frontend
    networks:
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --tries=1 http://localhost:3000 >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: talk2record_staging_postgres
    container_name: talk2record-staging-postgres
    restart: unless-stopped
    volumes:
      - staging_postgres_data:/var/lib/postgresql/18/docker
      - staging_postgres_data_backups:/backups
    env_file:
      - ${ENVS_DIR:-./.envs/.staging}/.postgres
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7.2
    container_name: talk2record-staging-redis
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data
    networks:
      - default

  celeryworker:
    <<: *django
    container_name: talk2record-staging-celeryworker
    command: /start-celeryworker
    networks:
      - default
    healthcheck:
      disable: true

  celerybeat:
    <<: *django
    container_name: talk2record-staging-celerybeat
    command: /start-celerybeat
    networks:
      - default
    healthcheck:
      disable: true

  flower:
    <<: *django
    container_name: talk2record-staging-flower
    command: /start-flower
    networks:
      - default
    healthcheck:
      disable: true

  awscli:
    profiles: ['backup']
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    image: talk2record_staging_awscli
    container_name: talk2record-staging-awscli
    env_file:
      - ${ENVS_DIR:-./.envs/.staging}/.django
    volumes:
      - staging_postgres_data_backups:/backups:z
    networks:
      - default
