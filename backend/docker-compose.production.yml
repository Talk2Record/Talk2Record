volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_redis_data: {}

networks:
  default:
  edge:
    name: talk2record_prod
    external: true

services:
  django: &django
    image: ${IMAGE_NAMESPACE:-ghcr.io/talk2record}/talk2record-django:${IMAGE_TAG:-latest}
    container_name: talk2record-prod-django
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ${ENVS_DIR:-./.envs/.production}/.django
      - ${ENVS_DIR:-./.envs/.production}/.postgres
    command: /start
    networks:
      - default
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket, sys
          s = socket.socket()
          s.settimeout(5)
          try:
              s.connect(("127.0.0.1", 5000))
              s.close()
              sys.exit(0)
          except Exception:
              sys.exit(1)
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s

  frontend:
    image: ${IMAGE_NAMESPACE:-ghcr.io/talk2record}/talk2record-frontend:${IMAGE_TAG:-latest}
    container_name: talk2record-prod-frontend
    restart: unless-stopped
    env_file:
      - ${ENVS_DIR:-./.envs/.production}/.frontend
    networks:
      - edge
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --tries=1 http://localhost:3000 >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: talk2record_production_postgres
    container_name: talk2record-prod-postgres
    restart: unless-stopped
    volumes:
      - production_postgres_data:/var/lib/postgresql/18/docker
      - production_postgres_data_backups:/backups
    env_file:
      - ${ENVS_DIR:-./.envs/.production}/.postgres
    networks:
      - default
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/redis:7.2
    container_name: talk2record-prod-redis
    restart: unless-stopped
    volumes:
      - production_redis_data:/data
    networks:
      - default

  celeryworker:
    <<: *django
    container_name: talk2record-prod-celeryworker
    command: /start-celeryworker
    networks:
      - default
    healthcheck:
      disable: true

  celerybeat:
    <<: *django
    container_name: talk2record-prod-celerybeat
    command: /start-celerybeat
    networks:
      - default
    healthcheck:
      disable: true

  flower:
    <<: *django
    container_name: talk2record-prod-flower
    command: /start-flower
    networks:
      - default
      - edge
    healthcheck:
      disable: true

  awscli:
    profiles: ['backup']
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    image: talk2record_production_awscli
    container_name: talk2record-prod-awscli
    env_file:
      - ${ENVS_DIR:-./.envs/.production}/.django
    volumes:
      - production_postgres_data_backups:/backups:z
    networks:
      - default
