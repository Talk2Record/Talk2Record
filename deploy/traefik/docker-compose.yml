volumes:
  traefik_acme: {}

networks:
  talk2record_prod:
    external: true
  talk2record_staging:
    external: true

services:
  traefik:
    image: docker.io/traefik:v3.6.10
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_acme:/etc/traefik/acme
    networks:
      - talk2record_prod
      - talk2record_staging
